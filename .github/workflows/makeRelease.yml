name: Make Release

on: 
    workflow_dispatch:
        inputs:
            version:
                description: 'Release Version'
                required: true


permissions: 
    contents: write

jobs:
    release:
        name: "Release"
        runs-on: windows-latest
        steps:
            - 
                name: Create Release
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    tag: ${{ inputs.version }}
                run: |
                    gh release create "$tag" \
                        --repo="$GITHUB_REPOSITORY" \
                        --title="${GITHUB_REPOSITORY#*/} ${tag#v}" \
                        --notes-file="Builds/release-notes.txt"
                        --verify-tag
                        --draft
